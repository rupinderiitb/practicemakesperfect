<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>My Tests</title>
<style>
:root{--ink:#1d2433;--mut:#5a6478;--line:#dfe4ee;--bg:#eef1f7;--acc:#1f4e8c;--accl:#e8f0fc;--accb:#9bb4de;--hdr:#1f4e8c;--hdrtx:#fff;--tmbg:rgba(255,255,255,.15);--hdrline:transparent}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:18px;color:var(--ink);background:var(--bg);line-height:1.55}
.top{position:sticky;top:0;z-index:9;background:var(--hdr);color:var(--hdrtx);border-bottom:3px solid var(--hdrline);padding:8px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.top h1{margin:0;font-size:18px;flex:1;min-width:140px}.top .tm{font-size:14px;background:var(--tmbg);border-radius:6px;padding:3px 10px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:6px;padding:7px 14px;font-size:14px;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff}.btn.grn{background:#2e9b4f;border-color:#2e9b4f;color:#fff}.btn.pur{background:#7b3fb0;border-color:#7b3fb0;color:#fff}.btn:disabled{opacity:.45;cursor:default}
.top .btn{border-color:var(--hdrtx)}
.wrap{max-width:1100px;margin:14px auto;padding:0 12px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px}
.main{min-width:0;background:#fff;border:1px solid var(--line);border-radius:10px;min-height:60vh;display:flex;flex-direction:column}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:#f7f9fd;border-radius:10px 10px 0 0;gap:10px;flex-wrap:wrap}
.qhead b{font-size:18px;color:var(--acc)}.qhead small{color:var(--mut);font-weight:400;margin-left:6px}.qt{font-size:14px;color:var(--mut)}.qt span{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.qbody{padding:14px 20px;flex:1;overflow-x:auto}
.src{font-size:12px;color:var(--mut);margin-bottom:8px}
.stem table.mt{border-collapse:collapse;margin:8px 0;max-width:100%}.stem table.mt td{border:1px solid var(--accb,#999);padding:4px 10px;vertical-align:top}.stem p{margin:6px 0}.stem p.mp{margin:10px 0;overflow-x:auto}
math{font-size:1.2em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:16px}
.o{display:flex;gap:12px;align-items:center;border:2px solid #cfd6e4;border-radius:10px;padding:10px 14px;cursor:pointer;background:#fff;min-height:54px}
.o:hover{border-color:var(--accb)}.o.sel{border-color:var(--acc);background:var(--accl)}
.ol{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #b9c3d6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.o.sel .ol{background:var(--acc);border-color:var(--acc);color:#fff}
.oc{flex:1;overflow-x:auto}
.resp{margin-top:16px}.num{width:220px;padding:10px 12px;font-size:18px;border:2px solid #b9c3d6;border-radius:8px}
.foot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px;border-top:1px solid var(--line);background:#f7f9fd;border-radius:0 0 10px 10px}.foot .sp{flex:1}
.side{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;align-self:start;position:sticky;top:62px;max-height:calc(100vh - 80px);overflow:auto}
.side h3{margin:0 0 8px;font-size:14px;color:var(--mut)}
#nav{display:flex;flex-wrap:wrap;gap:6px}
#nav button{width:34px;height:34px;font-size:13px;font-weight:700;color:#fff;border:0;cursor:pointer;background:#aeb6c5;border-radius:6px;position:relative}
#nav button.cur{outline:3px solid var(--acc);outline-offset:1px}
#nav .nv{background:#e4e8f0;color:#444;border:1px solid #c5ccda}#nav .na{background:#d9402f;border-radius:6px 6px 17px 17px}#nav .an{background:#1f6fd0;border-radius:17px 17px 6px 6px}#nav .ok{background:#2e9b4f;border-radius:17px 17px 6px 6px}#nav .bd{background:#e07b00;border-radius:17px 17px 6px 6px}
#nav .mk,#nav .am{background:#7b3fb0;border-radius:50%}#nav .am::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#1f6fd0;border:2px solid #fff}#nav .am.dr::after{background:#2e9b4f}#nav .am.dw::after{background:#e07b00}
#nav button.st::before{content:"\2605";position:absolute;top:-7px;right:-4px;font-size:14px;color:#f5b301;text-shadow:0 0 2px #fff,0 0 2px #fff}
.starbtn{border:1px solid #d9b000;background:#fff;color:#8a6d00;border-radius:6px;padding:4px 12px;font-size:13px;cursor:pointer}.starbtn.on{background:#fff3c4;font-weight:700}
.banner{border:2px solid #7b3fb0;background:#f6effb;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:15px}.banner .btn{margin:6px 6px 0 0}
.hist{margin-top:22px}.hist h3{margin:0 0 6px;font-size:15px;color:var(--mut)}.hist table{font-size:13px}.lnk{color:var(--acc);cursor:pointer;text-decoration:underline}
.tools2{margin-top:16px;font-size:13px;color:var(--mut)}.tools2 .btn{padding:4px 10px;font-size:13px;margin-right:6px}
#legend{display:grid;gap:5px;margin-top:12px;font-size:12px;color:var(--mut)}
#legend span{display:flex;align-items:center;gap:6px}#legend i{display:inline-block;width:18px;height:18px;position:relative;flex:none}
#legend i.nv{background:#e4e8f0;border:1px solid #c5ccda;border-radius:4px}#legend i.na{background:#d9402f;border-radius:4px 4px 10px 10px}#legend i.an{background:#1f6fd0;border-radius:10px 10px 4px 4px}#legend i.ok{background:#2e9b4f;border-radius:10px 10px 4px 4px}#legend i.bd{background:#e07b00;border-radius:10px 10px 4px 4px}#legend i.mk,#legend i.am{background:#7b3fb0;border-radius:50%}
#legend i.am::after{content:"";position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:50%;background:#1f6fd0;border:1.5px solid #fff}
.panel{max-width:640px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 30px}
.panel h2{margin:0 0 4px;color:var(--acc)}.panel label{display:block;margin:12px 0 4px;font-weight:600;font-size:15px}.panel select,.panel input[type=number]{width:100%;padding:9px 10px;font-size:16px;border:2px solid #b9c3d6;border-radius:8px;background:#fff}
.tbox{border:2px solid #cfd6e4;border-radius:10px;padding:10px 14px;background:#f7f9fd}.rad{display:flex;gap:8px;align-items:center;margin:4px 0;font-weight:600;cursor:pointer}.tin{margin:2px 0 4px 26px;font-size:15px}.panel .tin input[type=number]{width:90px;display:inline-block;padding:5px 8px;font-size:16px;margin:0 4px}.tnote{font-size:13px;color:var(--mut)}.tbox .tnote{margin-left:26px}.panel ul{padding-left:20px;color:var(--mut);font-size:15px}
#done{max-width:760px;margin:24px auto;padding:0 12px 60px}.sec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:14px 0}.sec h2,.sec h3{margin:0 0 8px;color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.kc{background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:10px 14px}.kc b{display:block;font-size:26px;color:var(--acc)}.kc small{color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}th{background:#f7f9fd;color:var(--mut)}
#typelist label.rad{font-weight:400;font-size:15px}#typelist .all{font-size:13px;margin:0 0 6px}#typelist .all span{color:var(--acc);cursor:pointer;text-decoration:underline;margin-right:12px}#typelist .cnt{color:var(--mut);margin-left:4px}.selsum{position:sticky;top:0;z-index:5;background:var(--accl);border:2px solid var(--accb);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:16px}.selsum.warn{background:#fdecea;border-color:#d9534f;color:#8a1c14}.selsum b{font-size:17px}
.gf{border:2px solid var(--accb);background:#fff;border-radius:12px;padding:12px 14px;margin:0 0 14px}.gf .gft{font-size:16px;font-weight:700;margin:0 0 2px}.gf .gfn{font-size:13px;color:var(--mut);margin:0 0 8px}
.tc{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin:0 0 12px}.tc.zero{background:#f4f4f4}.tc.zero .th span{color:#777}
#typelist .tc label.th{margin:0 0 2px;font-size:16px;font-weight:700}.tc .tcnt{margin:0 0 8px 28px;font-size:14px;color:var(--mut)}.tc.zero .tcnt{color:#b3261e;font-weight:600}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}.grp .gl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);width:76px;flex:none}
#typelist label.pill{display:inline-block;margin:0;padding:0;font-weight:400;cursor:pointer;position:relative}#typelist .pill input{position:absolute;opacity:0;width:1px;height:1px}
#typelist .pill input+span{display:inline-block;padding:6px 12px;border:2px solid var(--accb);border-radius:999px;background:#fff;color:var(--acc);font-size:14px;font-weight:600;line-height:1.2}
#typelist .pill input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff}#typelist .pill input:checked+span .cc{color:#fff;opacity:.85}#typelist .pill input:focus-visible+span{outline:3px solid #f5b301;outline-offset:2px}
#typelist .pill .cc{font-style:normal;font-weight:400;color:var(--mut);margin-left:2px}.tc.zero .pill span{opacity:.6}
@media(max-width:480px){.grp .gl{width:100%}}
#typelist hr{border:0;border-top:1px solid var(--line);margin:8px 0}
#typeln{display:inline-block;background:var(--accl);color:var(--acc);border-radius:12px;padding:2px 12px;font-size:13px;margin-bottom:10px}
.ngrp{width:100%;font-size:12px;color:var(--mut);margin:8px 0 2px;font-weight:600}.ngrp:first-child{margin-top:0}
#palbtn{display:none;width:100%;text-align:left}
@media(max-width:800px){.wrap{grid-template-columns:minmax(0,1fr);padding:0 8px;margin:8px auto}.side{position:static;order:-1;max-height:none;padding:8px}#palh{display:none}#palbtn{display:block;min-height:42px;font-size:15px}#navbox{display:none;margin-top:8px}#navbox.open{display:block}body{font-size:17px}
.top{padding:6px 10px;gap:8px}.top h1{font-size:16px}.btn,.starbtn{min-height:42px}.qhead{padding:8px 12px}.qbody{padding:12px 12px 130px}
.stem math,.oc math{font-size:1.02em}.foot{position:sticky;bottom:0;padding:8px;gap:6px;box-shadow:0 -2px 6px rgba(0,0,0,.08)}.foot .btn{padding:6px 10px;font-size:13px;flex:1 1 auto}.foot .sp{display:none}.opts{grid-template-columns:minmax(0,1fr)}.panel{margin:12px 8px;padding:18px 16px}}
.chk{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.chkres{font-size:16px;font-weight:600}.chkres.r{color:#1e7a3a}.chkres.w{color:#b3261e}.chkres.h{color:var(--mut);font-weight:400}
.o.ok{border-color:#2e9b4f;background:#eaf7ee}.o.ok .ol{background:#2e9b4f;border-color:#2e9b4f;color:#fff}.o.bad{border-color:#d9402f;background:#fdeceb}.o.bad .ol{background:#d9402f;border-color:#d9402f;color:#fff}
.num.ok{border-color:#2e9b4f;background:#eaf7ee}.num.bad{border-color:#d9402f;background:#fdeceb}
.o.dead{opacity:.4;text-decoration:line-through;pointer-events:none}.shb{border-color:#9a6a00;color:#8a6d00}
.tw{overflow-x:auto}.tw table{min-width:0}.tw th,.tw td{padding:5px 5px;vertical-align:top}@media(max-width:600px){.tw table{font-size:13px}.tw th,.tw td{padding:4px 3px}.dE,.dM,.dD{padding:1px 5px;font-size:11px}.tcell{padding:2px 4px}}tr.hid{display:none}.tcell{white-space:nowrap;font-variant-numeric:tabular-nums;border-radius:6px;padding:2px 8px;display:inline-block}.tg{background:#e3f4e8;color:#1e6b34}.ta{background:#fff1d6;color:#8a5a00}.tr{background:#fde3e0;color:#a3241b}.tn{color:#5a6478}
.flt{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 10px}.flt label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:2px}.flt select{font-size:15px;padding:6px 8px;border:2px solid #b9c3d6;border-radius:8px;background:#fff;min-height:40px}
.dE,.dM,.dD{font-weight:700;border-radius:10px;padding:1px 8px;font-size:12px;white-space:nowrap}.dE{background:#e3f4e8;color:#1e6b34}.dM{background:#fff1d6;color:#8a5a00}.dD{background:#fde3e0;color:#a3241b}
.acts .lnk{display:inline-block;padding:6px 14px 6px 0}.actr td{padding-top:0;border-top:0}.lnk.del{color:#b3261e}.actrow{display:flex;gap:10px;flex-wrap:wrap}

.panel .f{margin:10px 0}.panel .f input{width:100%;padding:10px 12px;font-size:17px;border:2px solid #b9c3d6;border-radius:8px}.panel .f label{margin:0 0 3px}
.err{color:#b3261e;font-weight:600;margin:8px 0;min-height:1.2em}.big{width:100%;min-height:48px;font-size:17px}
.rl{width:100%;border-collapse:collapse;margin:10px 0}.rl td,.rl th{border-bottom:1px solid #d5dbe8;padding:8px 6px;text-align:left;font-size:15px}.rl .btn{min-height:36px;font-size:14px}.rl tr.grey td{color:#8a93a6}.rl tr.grey td small{color:#8a93a6}.tag{display:inline-block;padding:2px 8px;border-radius:10px;background:#e8edf7;font-size:12px;font-weight:600}
#pdfbox{display:none}
@media print{body>*{display:none!important}body>#pdfbox{display:block!important;padding:10px;font-size:13px}#pdfbox table{width:100%}}
</style></head><body>
<div id="login" class="panel">
<h2>My Tests</h2><div style="color:var(--mut);margin-bottom:6px">Sign in to see your upcoming tests, start a test that is open, and see your past results. After a test window closes you can download your full paper with the correct answers, right/wrong marking and your analysis.</div>
<div class="f"><label for="sid">Your student ID</label><input id="sid" autocomplete="off"></div>
<div class="f"><label for="pin">Your PIN or password (first PIN is given by your teacher)</label><input id="pin" type="password" autocomplete="off"></div>
<div class="err" id="lerr"></div><button class="btn pri big" id="go">Show my results</button>
</div>
<div id="list" class="panel" hidden style="max-width:900px"><h2 id="who"></h2><div id="lnote" class="err"></div><h3>Tests for you</h3><div id="up"></div><h3>Past tests</h3><div id="tbl"></div><div style="margin:12px 0"><button class="btn" id="chg">Change my PIN / password</button>
<div id="chgbox" hidden style="margin-top:8px"><div class="f"><label for="np">New PIN or password (4 to 40 characters)</label><input id="np" type="password" autocomplete="new-password"></div>
<div class="f"><label for="np2">Type it again</label><input id="np2" type="password" autocomplete="new-password"></div>
<button class="btn pri" id="chgok">Save new password</button> <span class="err" id="cmsg"></span></div></div>
<button class="btn" id="out">Sign out</button></div>
<div id="pdfbox"></div>
<script>
/* shared by the test page and the My Results page: builds the full-paper review (PDF) as HTML */
var RV=(function(){
 function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 function fmt(sec){sec=Math.max(0,Math.round(sec||0));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return(h?h+':'+('0'+m).slice(-2):m)+':'+('0'+s).slice(-2)}
 var LV={E:'Easy',M:'Medium',D:'Difficult'};
 var CSS='<style>.rv{font-size:13px}.rv h1{font-size:20px;margin:0 0 4px}.rv h2{font-size:17px;margin:18px 0 6px;border-bottom:2px solid #444;padding-bottom:3px}.rv h3{font-size:15px;margin:12px 0 6px;color:#333}.rv table{border-collapse:collapse;margin:6px 0}.rv td,.rv th{border:1px solid #999;padding:3px 8px;text-align:left}.rv .cards{display:flex;gap:10px;margin:8px 0}.rv .cards div{border:1px solid #999;border-radius:6px;padding:6px 12px;text-align:center}.rv .cards b{display:block;font-size:18px}'
 +'.rv .rq{border:1px solid #bbb;border-radius:6px;padding:8px 10px;margin:8px 0;break-inside:avoid-page;page-break-inside:avoid}.rv .rqh{font-weight:bold;margin-bottom:4px}.rv .rqr{margin-top:6px;padding-top:4px;border-top:1px dashed #aaa}'
 +'.rv .o.mysel{outline:2px solid #1a56c8;outline-offset:-2px}.rv .o.ok-ans{background:#dff3e3}.rv .good{color:#0b7a2b;font-weight:bold}.rv .bad{color:#b3261e;font-weight:bold}.rv .na{color:#666;font-weight:bold}</style>';
 function abcTable(o){function row(n,a){return'<tr><td>'+n+'</td><td>'+a[0]+' − '+a[1]+' − '+a[2]+'</td></tr>'}return'<table><tr><th>Level</th><th>attempted − correct − in the paper</th></tr>'+row('Easy',o.E)+row('Medium',o.M)+row('Difficult',o.D)+'</table>'}
 function aggTable(title,arr){if(!arr||!arr.length)return'';var t='<h3>'+title+'</h3><table><tr><th>Name</th><th>Questions</th><th>Attempted</th><th>Correct</th><th>Accuracy % (of attempted)</th><th>Avg time</th></tr>';
  arr.forEach(function(x){t+='<tr><td>'+esc(x.name)+'</td><td>'+x.q+'</td><td>'+x.attempted+'</td><td>'+x.correct+'</td><td>'+(x.attempted?Math.round(1000*x.correct/x.attempted)/10:'—')+'</td><td>'+fmt(x.avgTime)+'</td></tr>'});return t+'</table>'}
 function qhtml(q,given,row){var d=document.createElement('div');d.innerHTML=q.html;
  if(q.kind==='single'){[].forEach.call(d.querySelectorAll('.o'),function(o){var l=o.getAttribute('data-l');o.classList.remove('sel');if(given===l)o.classList.add('mysel');if(row&&row.key&&row.key.split(' or ').indexOf(l)>=0)o.classList.add('ok-ans')})}
  else{[].forEach.call(d.querySelectorAll('input.num'),function(i){var b=document.createElement('b');b.textContent='[ '+(given||'—')+' ]';i.parentNode.replaceChild(b,i)})}
  return d.innerHTML}
 function build(d){
  var m=d.meta||{},P=d.paper,rows={};(d.rows||[]).forEach(function(r){rows[r.id]=r});var full=!!d.rows,qs={};P.questions.forEach(function(q){qs[q.id]=q});
  var h=CSS+'<div class="rv"><h1>'+esc(d.title||P.title)+(full?' — full paper with answers and analysis':' — my full paper')+'</h1><p>'+esc(d.who.name)+' · '+esc(d.who.sid||'')+' · '+esc(d.who.batch||'')+(m.code?' · code '+esc(m.code):'')+(m.attemptNo?' · attempt '+esc(m.attemptNo):'')+(m.date?' · '+esc(m.date):'')+'</p>';
  if(m.score!=null)h+='<div class="cards"><div><b>'+m.score+' / '+m.max+'</b>Score (+4 / −1)</div><div><b>'+m.correct+'</b>Correct</div><div><b>'+m.wrong+'</b>Wrong</div><div><b>'+m.unanswered+'</b>Not answered</div></div>';
  if(d.abc){h+='<h3>How well did you choose your questions? (attempted − correct − in the paper)</h3>'+abcTable(d.abc.overall);var subs=Object.keys(d.abc.subjects||{});if(subs.length>1)subs.forEach(function(s){h+='<h3>'+esc(s)+'</h3>'+abcTable(d.abc.subjects[s])})}
  if(m.timeUsedSec!=null)h+='<p>Time used: <b>'+fmt(m.timeUsedSec)+'</b>'+(m.durationMin?' of '+m.durationMin+' min':'')+' · Questions over the expected time: <b>'+(m.overtime==null?'—':m.overtime)+'</b> · Answer changes: <b>'+(m.changes==null?'—':m.changes)+'</b> · Warnings: <b>'+(m.strikes==null?'—':m.strikes)+'</b>'+(m.late==='Y'||m.late===true?' · <span class="bad">Late</span>':'')+'</p>';
  if(full){h+=aggTable('Accuracy by question type (weakest first)',d.byType);if((d.byChapter||[]).length>1)h+=aggTable('Accuracy by chapter (weakest first)',d.byChapter)}
  else h+='<p><i>The correct answers and the right/wrong marking are available from the My Results page after the test window closes.</i></p>';
  var n=0,lastSubj=null;
  P.sections.forEach(function(sec,si){
   var subj=(sec.qids.length&&rows[sec.qids[0]]&&rows[sec.qids[0]].subject)||sec.subject||P.subject||'';
   if(subj!==lastSubj){h+='<h2>'+esc(subj)+'</h2>';lastSubj=subj}
   h+='<h3>'+esc(sec.name)+'</h3>';
   sec.qids.forEach(function(id){n++;var q=qs[id],r=rows[id],g=r?r.given:(d.given||{})[id]||'';
    h+='<div class="rq"><div class="rqh">Q'+n+(r?' · '+(LV[r.level]||'')+' · '+esc(r.type):'')+'</div>'+qhtml(q,g,r);
    if(r){var res=r.result==='R'?'<span class="good">✔ Correct</span>':r.result==='W'?'<span class="bad">✘ Wrong</span>':r.result==='X'?'<span class="na">Dropped (not counted)</span>':'<span class="na">Not answered</span>';
     h+='<div class="rqr">Your answer: <b>'+esc(g||'—')+'</b> · Correct answer: <b>'+esc(r.key||'—')+'</b> · '+res+' · Time '+fmt(r.time)+' (expected '+fmt(r.exp)+')'+(r.over?' · over time':'')+'</div>'}
    else h+='<div class="rqr">Your answer: <b>'+esc(g||'—')+'</b></div>';

function load(){$('lerr').textContent='Checking...';$('go').disabled=true;
 api({a:'myresults',sid:$('sid').value.trim(),pin:$('pin').value.trim()},30000).then(function(r){$('go').disabled=false;

  if(!tests.length)uh='<p>No tests are scheduled for your batch right now.</p>';else{
   uh='<table class="rl"><tr><th>Test</th><th>Type</th><th>Opens</th><th>Closes</th><th>Time</th><th></th></tr>';
   tests.forEach(function(x){var done=x.used>=x.max,act='';

    else act='<span class="tag">Open</span><br><small>Code: '+esc(x.code)+'</small>';
    uh+='<tr'+(x.state==='open'&&!done?'':' class="grey"')+'><td>'+esc(x.title)+(x.series?'<br><small>'+esc(x.series)+'</small>':'')+'</td><td>'+esc(x.kind||'')+'</td><td>'+F(x.opens)+'</td><td>'+F(x.closes)+'</td><td>'+(x.durationMin?esc(x.durationMin)+' min':'')+'</td><td>'+act+'</td></tr>'});
   uh+='</table>'}
  $('up').innerHTML=uh;
  if(!r.attempts.length){$('tbl').innerHTML='<p>No submitted tests yet.</p>';return}

  $('tbl').innerHTML=h+'</table>';
  [].forEach.call(document.querySelectorAll('.dl'),function(b){b.onclick=function(){dl(b)}})},
 function(){$('go').disabled=false;$('lerr').textContent='Could not reach the server. Check your internet and try again.'})}

 function(){b.disabled=false;b.textContent=t;$('lnote').textContent='Could not reach the server. Try again.'})}
