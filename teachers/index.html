<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher page | Adventure IIT</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--hd:#2b3a67;--ac:#3b5bdb;--ln:#d5dbe8;--bg:#f4f6fb;--tx:#1d2433;--mu:#5b6578;--gr:#1e8a3c;--rd:#d9402f;--am:#e07b00}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--hd);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 18px;position:sticky;top:0;z-index:5}
header img{height:34px}header h1{font-size:17px;margin:0;font-weight:600;flex:1}header .who{font-size:13px;opacity:.92}
button,.btn{font:inherit;border:1px solid var(--ln);background:#fff;color:var(--tx);border-radius:6px;padding:6px 12px;cursor:pointer}button.pri{background:var(--ac);border-color:var(--ac);color:#fff}header button{background:transparent;color:#fff;border-color:#ffffff66}
main{max-width:1280px;margin:0 auto;padding:16px 18px 60px}
#login{max-width:360px;margin:60px auto;background:#fff;border:1px solid var(--ln);border-radius:10px;padding:22px}#login h2{margin:0 0 12px}#login input{width:100%;padding:9px;margin:5px 0 10px;border:1px solid var(--ln);border-radius:6px;font:inherit}#lerr{color:var(--rd);min-height:20px;font-size:13px}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 16px}.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:10px 14px;min-width:130px}.card b{display:block;font-size:22px}.card span{color:var(--mu);font-size:12.5px}
h2{font-size:18px;margin:22px 0 8px}h3{font-size:15px;margin:16px 0 6px}.sub{color:var(--mu);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tabs button.on{background:var(--hd);color:#fff;border-color:var(--hd)}
.tw{overflow:auto;border:1px solid var(--ln);border-radius:10px;background:#fff;max-height:70vh}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 9px;border-bottom:1px solid #e8ecf4;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#eef1f8;cursor:pointer;user-select:none;z-index:1}tr:nth-child(even) td{background:#fafbfe}tr.lk{cursor:pointer}tr.lk:hover td{background:#eaf0ff}
td.n,th.n{text-align:right}.pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;border:1px solid var(--ln);background:#fff}.pill.open{background:#e3f5e8;border-color:#9fd5ae;color:#17632d}.pill.upcoming{background:#fff3dc;border-color:#f0cf8a;color:#8a5a00}.pill.closed{background:#eceff5;color:#555}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0}.bar .l{width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .t{flex:1;height:13px;background:#e4e8f0;border-radius:7px;overflow:hidden;position:relative}.bar .t i{display:block;height:100%;border-radius:7px}.bar .t u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#222}.bar b{min-width:150px;text-align:right;white-space:nowrap}
.g{color:var(--gr)}.r{color:var(--rd)}.a{color:var(--am)}.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.tools input,.tools select{padding:6px 9px;border:1px solid var(--ln);border-radius:6px;font:inherit}
.note{background:#fff8e1;border:1px solid #f0d98a;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}a.back{cursor:pointer;color:var(--ac)}
@media print{header,.tools,.tabs,button{display:none!important}.tw{max-height:none;overflow:visible}main{padding:0}}
</style></head><body>

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function api(b,ms){var c=new AbortController(),t=setTimeout(function(){c.abort()},ms||90000);return fetch(CFG.api,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),signal:c.signal}).then(function(r){clearTimeout(t);return r.json()}).catch(function(){clearTimeout(t);return{ok:false,message:'Could not reach the server. Check the internet and try again.'}})}
function call(a,x){var b={a:a,tid:CRED.tid,pw:CRED.pw};for(var k in (x||{}))b[k]=x[k];return api(b)}
function P(x){return x==null||x===''?'—':(Math.round(x*10)/10)+'%'}
function N(x){return x==null||x===''?'—':x}
function mm(s){s=Math.max(0,Math.round(s||0));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+':'+('0'+m).slice(-2):m)+':'+('0'+r).slice(-2)}
function dt(ms){if(!ms)return'—';var d=new Date(ms);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function col(p){return p==null||p===''?'':p>=70?'g':p>=40?'a':'r'}
function bar(label,p,avg,txt){var c=p==null||p===''?'#aab':p>=70?'#1e8a3c':p>=40?'#e07b00':'#d9402f';return'<div class="bar"><span class="l" title="'+esc(label)+'">'+esc(label)+'</span><div class="t"><i style="width:'+Math.max(0,Math.min(100,p||0))+'%;background:'+c+'"></i>'+(avg!=null?'<u style="left:'+Math.min(100,avg)+'%" title="batch average"></u>':'')+'</div><b>'+(txt||P(p))+'</b></div>'}
/* generic sortable table: cols=[{h,n:right-aligned}], rows=[{c:[{t,v}],go:fn-name-string}] */
var TB={};
function tbl(id,cols,rows,sortCol,desc){var s=TB[id]||(TB[id]={c:sortCol==null?-1:sortCol,d:!!desc});TB[id].rows=rows;TB[id].cols=cols;return drawT(id)}
function drawT(id){var s=TB[id],r=s.rows.slice();if(s.c>=0)r.sort(function(a,b){var x=a.c[s.c].v,y=b.c[s.c].v;if(x===y||(x==null&&y==null))return 0;if(x==null||x==='')return 1;if(y==null||y==='')return -1;var q=typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y));return s.d?-q:q});
 var h='<div class="tw"><table><tr>'+s.cols.map(function(c,i){return'<th class="'+(c.n?'n':'')+'" onclick="sortT(\''+id+'\','+i+')">'+esc(c.h)+(s.c===i?(s.d?' ▼':' ▲'):'')+'</th>'}).join('')+'</tr>';
 r.forEach(function(x){h+='<tr'+(x.go?' class="lk" onclick="'+x.go+'"':'')+'>'+x.c.map(function(c,i){return'<td class="'+(s.cols[i].n?'n ':'')+(c.k||'')+'">'+(c.h!=null?c.h:esc(c.t))+'</td>'}).join('')+'</tr>'});
 return h+(r.length?'':'<tr><td colspan="'+s.cols.length+'" class="sub">Nothing to show.</td></tr>')+'</table></div>'}
function sortT(id,i){var s=TB[id];if(s.c===i)s.d=!s.d;else{s.c=i;s.d=false}var el=document.getElementById('w_'+id);if(el)el.innerHTML=drawT(id)}
function W(id,html){return'<div id="w_'+id+'">'+html+'</div>'}
function csv(name,head,rows){var t=[head].concat(rows).map(function(r){return r.map(function(v){v=String(v==null?'':v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function busy(m){$('app').innerHTML='<p class="sub">'+esc(m||'Loading...')+'</p>'}
function fail(r){$('app').innerHTML='<div class="note">'+esc(r.message||'Something went wrong.')+'</div><button onclick="home()">Back to the overview</button>'}
/* ---------- login ---------- */
function save(){try{sessionStorage.setItem('pyqt_teacher',JSON.stringify(CRED))}catch(e){}}
function signIn(tid,pw,quiet){$('lerr').textContent=quiet?'':'Checking...';return api({a:'t_login',tid:tid,pw:pw}).then(function(r){if(!r.ok){if(!quiet)$('lerr').textContent=r.message||'Not accepted.';try{sessionStorage.removeItem('pyqt_teacher')}catch(e){}return}CRED={tid:tid,pw:pw};save();$('login').hidden=true;$('app').hidden=false;$('out').hidden=false;$('chg').hidden=false;$('who').textContent=r.teacher.name+(r.teacher.subjects&&r.teacher.subjects.length?' ('+r.teacher.subjects.join(', ')+')':'')+' · '+(r.teacher.batches||'no batches');home()})}
$('go').onclick=function(){signIn($('tid').value.trim(),$('pw').value)};$('pw').onkeydown=function(e){if(e.key==='Enter')$('go').click()};
function cmsg(t,ok){var e=$('cmsg');e.textContent=t;e.style.color=ok?'#1e8a3c':'#d9402f'}
$('chg').onclick=function(){$('cp0').value=$('cp1').value=$('cp2').value='';cmsg('');$('cbox').hidden=false;$('cp0').focus()};
$('ccancel').onclick=function(){$('cbox').hidden=true};
$('cok').onclick=function(){var a=$('cp0').value,b=$('cp1').value,c=$('cp2').value;if(!a||!b)return cmsg('Fill in all the boxes.');if(b!==c)return cmsg('The two new passwords are not the same.');if(a!==CRED.pw)return cmsg('The current password is not correct.');cmsg('Changing...',true);api({a:'t_changepw',tid:CRED.tid,pw:a,newpw:b}).then(function(r){if(!r.ok)return cmsg(r.message||'Not changed.');CRED.pw=b;save();cmsg('Password changed.',true);setTimeout(function(){$('cbox').hidden=true},1200)})};
$('out').onclick=function(){CRED=null;OV=null;try{sessionStorage.removeItem('pyqt_teacher')}catch(e){}location.reload()};
/* ---------- overview ---------- */
function doReset(sid,name){if(!confirm('Give '+name+' ('+sid+') a new temporary PIN? Their old PIN or password will stop working.'))return;call('t_resetpw',{sid:sid}).then(function(r){if(!r.ok){alert(r.message||'Could not reset.');return}
 $('rtxt').innerHTML='Temporary PIN for <b>'+esc(r.name)+'</b> ('+esc(r.sid)+'):<div style="font-size:32px;letter-spacing:4px;margin:8px 0" id="rpin">'+esc(r.pin)+'</div>Valid for '+r.hours+' hours. Tell the student. They must choose their own password when they sign in. This PIN is shown only once. The reset is recorded for the owner.';$('rbox').hidden=false})}
$('rok').onclick=function(){$('rbox').hidden=true;$('rtxt').innerHTML='';if(CUR.stu&&!CUR.test&&!OV)return;home()};
function home(){busy();call('t_overview').then(function(r){if(!r.ok)return fail(r);OV=r;drawHome()})}
function drawHome(){CUR.test=null;var r=OV,now=r.now,h='';
 var ns=r.students.length,att=r.students.filter(function(s){return s.tests>0}).length;
 h+='<h2>Overview</h2><div class="cards"><div class="card"><b>'+ns+'</b><span>students in your batches</span></div><div class="card"><b>'+r.tests.length+'</b><span>tests for your batches</span></div><div class="card"><b>'+r.tests.filter(function(t){return t.state==='open'}).length+'</b><span>open now</span></div><div class="card"><b>'+att+'</b><span>students with at least one test</span></div></div>';
 if(r.resets&&r.resets.length)h+='<h3>Password reset requests ('+r.resets.length+')</h3><div class="note">These students pressed "Forgot password". Check that it is really the student, then press Reset and tell them the temporary PIN.</div>'+W('rs',tbl('rs',[{h:'Requested'},{h:'Name'},{h:'ID'},{h:'Batch'},{h:''}],r.resets.map(function(x){return{c:[{t:x.time.slice(0,16).replace('T',' '),v:x.time},{t:x.name,v:x.name},{t:x.sid,v:x.sid},{t:x.batch,v:x.batch},{h:'<button class="pri" onclick="event.stopPropagation();doReset(\''+esc(x.sid)+'\',\''+esc(x.name).replace(/\'/g,'')+'\')">Reset</button>',v:''}]}}),0));
 h+='<h3>Batches</h3>'+W('b',tbl('b',[{h:'Batch'},{h:'Students',n:1},{h:'Students with tests',n:1},{h:'Average score %',n:1}],r.batches.map(function(b){return{c:[{t:b.name,v:b.name},{t:b.students,v:b.students},{t:b.withTests,v:b.withTests},{t:P(b.avgPct),v:b.avgPct,k:col(b.avgPct)}]}}),0));
 h+='<h3>Tests</h3><div class="tools"><select id="tsf" onchange="redrawTests()"><option value="">All states</option><option>open</option><option>upcoming</option><option>closed</option></select><input id="tsq" placeholder="Search title or code" oninput="redrawTests()"></div>'+W('t',testsT());
 h+='<h3>Students</h3><div class="tools">'+stuBatchSel()+'<input id="sq" placeholder="Search name or ID" oninput="redrawStu()"></div>'+W('s',stuT());
 $('app').innerHTML=h}
function testsT(){var st=($('tsf')||{}).value||'',q=(($('tsq')||{}).value||'').toLowerCase(),rows=OV.tests.filter(function(t){return(!st||t.state===st)&&(!q||(t.title+' '+t.code).toLowerCase().indexOf(q)>=0)}).map(function(t){return{go:"openTest('"+esc(t.code)+"')",c:[{t:t.title+' ('+t.code+')',v:t.title},{t:t.forBatch||'All',v:t.forBatch},{h:'<span class="pill '+t.state+'">'+t.state+'</span>',v:t.state},{t:dt(t.opens),v:t.opens},{t:dt(t.closes),v:t.closes},{t:t.targeted,v:t.targeted},{t:t.attempted,v:t.attempted},{t:t.notAttempted,v:t.notAttempted,k:t.notAttempted&&t.state!=='upcoming'?'r':''},{t:P(t.avgPct),v:t.avgPct,k:col(t.avgPct)},{t:P(t.best),v:t.best}]}});
 return tbl('t',[{h:'Test'},{h:'For batch'},{h:'Status'},{h:'Opens'},{h:'Closes'},{h:'Students',n:1},{h:'Attempted',n:1},{h:'Not attempted',n:1},{h:'Average %',n:1},{h:'Best %',n:1}],rows,3,true)}
function redrawTests(){TB.t&&delete TB.t;$('w_t').innerHTML=testsT()}
function stuBatchSel(){var b={};OV.students.forEach(function(s){b[s.batch]=1});var k=Object.keys(b).sort();if(k.length<2)return'';if(CUR.sbf&&!b[CUR.sbf])CUR.sbf='';return'<select id="sbf" onchange="CUR.sbf=this.value;redrawStu()"><option value="">All batches ('+OV.students.length+')</option>'+k.map(function(x){var n=OV.students.filter(function(s){return s.batch===x}).length;return'<option value="'+esc(x)+'"'+(CUR.sbf===x?' selected':'')+'>'+esc(x)+' ('+n+')</option>'}).join('')+'</select>'}
function stuT(){var q=(($('sq')||{}).value||'').toLowerCase(),rows=OV.students.filter(function(s){return(!CUR.sbf||s.batch===CUR.sbf)&&(!q||(s.name+' '+s.sid).toLowerCase().indexOf(q)>=0)}).map(function(s){return{go:"openStudent('"+esc(s.sid)+"')",c:[{t:s.name,v:s.name},{t:s.sid,v:s.sid},{t:s.batch,v:s.batch},{t:s.tests,v:s.tests},{t:s.attempts,v:s.attempts},{t:P(s.avgPct),v:s.avgPct,k:col(s.avgPct)},{t:s.last||'—',v:s.last}]}});
 return tbl('s',[{h:'Name'},{h:'ID'},{h:'Batch'},{h:'Tests',n:1},{h:'Attempts',n:1},{h:'Average %',n:1},{h:'Last test'}],rows,0)}
function redrawStu(){delete TB.s;$('w_s').innerHTML=stuT()}
/* ---------- one test ---------- */
function openTest(code){busy();call('t_test',{code:code}).then(function(r){if(!r.ok)return fail(r);CUR.test=r;CUR.tab='ranks';drawTest()})}
function drawTest(){var r=CUR.test,t=r.test,s=r.summary,h='<a class="back" onclick="drawHome()">&larr; Overview</a><h2>'+esc(t.title)+' <span class="pill '+t.state+'">'+t.state+'</span></h2><div class="sub">Code '+esc(t.code)+' · for '+esc(t.batch||'All')+(t.series?' · '+esc(t.series):'')+' · opens '+dt(t.opens)+' · closes '+dt(t.closes)+' · '+N(t.durationMin)+' min · first attempts only unless stated</div>';
 h+='<div class="cards"><div class="card"><b>'+s.attempted+' / '+s.targeted+'</b><span>attempted</span></div><div class="card"><b>'+P(s.avgPct)+'</b><span>average</span></div><div class="card"><b>'+P(s.median)+'</b><span>median</span></div><div class="card"><b>'+P(s.highest)+'</b><span>highest</span></div><div class="card"><b>'+P(s.lowest)+'</b><span>lowest</span></div></div>';
 var T=[['ranks','Rank list'],['not','Not attempted ('+s.notAttempted+')'],['first','First '+(s.firstN||'N')+' answers'],['qs','Questions'],['tc','Types, chapters, sections']];
 h+='<div class="tabs">'+T.map(function(x){return'<button class="'+(CUR.tab===x[0]?'on':'')+'" onclick="CUR.tab=\''+x[0]+'\';drawTest()">'+x[1]+'</button>'}).join('')+'</div>';
 h+=({ranks:ranksV,not:notV,first:firstV,qs:qsV,tc:tcV})[CUR.tab]();$('app').innerHTML=h}
function sdone(){return CUR.test.students.filter(function(x){return x.attempted})}
function batchSel(){var b={};CUR.test.students.forEach(function(x){b[x.batch]=1});var k=Object.keys(b);return k.length>1?'<select id="bf" onchange="CUR.bf=this.value;drawTest()"><option value="">All batches</option>'+k.sort().map(function(x){return'<option'+(CUR.bf===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>':''}
function ranksV(){var rows=sdone().filter(function(x){return!CUR.bf||x.batch===CUR.bf});delete TB.r;
 var h='<div class="tools">'+batchSel()+'<button onclick="dlRanks()">Download CSV</button><button onclick="window.print()">Print</button></div>';
 return h+W('r',tbl('r',[{h:'Rank',n:1},{h:'Name'},{h:'ID'},{h:'Batch'},{h:'Score',n:1},{h:'%',n:1},{h:'Correct',n:1},{h:'Wrong',n:1},{h:'Not answered',n:1},{h:'Time used'},{h:'Over time Qs',n:1},{h:'Careless? wrong',n:1},{h:'Concept? wrong',n:1},{h:'Flags'}],rows.map(function(x){return{go:"openStudent('"+esc(x.sid)+"')",c:[{t:x.rank,v:x.rank},{t:x.name,v:x.name},{t:x.sid,v:x.sid},{t:x.batch,v:x.batch},{t:x.score+' / '+x.max,v:x.score},{t:P(x.pct),v:x.pct,k:col(x.pct)},{t:x.correct,v:x.correct},{t:x.wrong,v:x.wrong},{t:x.unanswered,v:x.unanswered},{t:mm(x.timeUsedSec),v:x.timeUsedSec},{t:x.overtime,v:x.overtime},{t:x.careless,v:x.careless},{t:x.concept,v:x.concept},{t:(x.flags||[]).join(', '),v:(x.flags||[]).length,k:(x.flags||[]).length?'r':''}]}}),0))}
function dlRanks(){var rows=sdone().sort(function(a,b){return a.rank-b.rank}).map(function(x){return[x.rank,x.sid,x.name,x.batch,x.score,x.max,x.pct,x.correct,x.wrong,x.unanswered,mm(x.timeUsedSec),x.overtime,(x.flags||[]).join(' ')]});csv(CUR.test.test.code+'-ranks.csv',['Rank','ID','Name','Batch','Score','Out of','%','Correct','Wrong','Not answered','Time used','Overtime Qs','Flags'],rows)}
function notV(){var l=CUR.test.students.filter(function(x){return!x.attempted});return'<p class="sub">Students for whom this test is meant and who have no submitted attempt'+(CUR.test.test.state==='open'?' yet (the test is still open)':'')+'.</p>'+W('n',tbl('n',[{h:'Name'},{h:'ID'},{h:'Batch'}],l.map(function(x){return{go:"openStudent('"+esc(x.sid)+"')",c:[{t:x.name,v:x.name},{t:x.sid,v:x.sid},{t:x.batch,v:x.batch}]}}),0))}
function firstV(){var s=CUR.test.summary;if(!s.firstN)return'<div class="note">The first-answers analysis applies to papers with 25 or more questions.</div>';var d=sdone();
 var h='<div class="note">First '+s.firstN+' = the first '+s.firstN+' questions a student marked an answer for. Stuck = medium or difficult, more than 1.5 times the expected time. Unmarked = questions over 1.5 minutes that had no answer marked before the '+s.firstN+'th answer. Only attempts taken after the order log was added have these numbers.</div>';
 var rows=d.map(function(x){var f=x.first;if(!f)return{go:"openStudent('"+esc(x.sid)+"')",c:[{t:x.name,v:x.name},{t:x.score,v:x.score},{t:'not recorded',v:null}].concat(Array(11).fill({t:'',v:null}))};return{go:"openStudent('"+esc(x.sid)+"')",c:[{t:x.name,v:x.name},{t:x.score,v:x.score},{t:f.easyChosen+' / '+f.easyInPaper,v:f.easyChosen},{t:f.easyRight,v:f.easyRight},{t:f.medChosen+' → '+f.medRight,v:f.medChosen},{t:f.diffChosen+' → '+f.diffRight,v:f.diffChosen},{t:f.stuck,v:f.stuck,k:f.stuck?'r':''},{t:f.slowEasy,v:f.slowEasy},{t:f.sinks+' ('+Math.round(f.sinkSec/6)/10+' min)',v:f.sinkSec,k:f.sinks?'r':''},{t:mm(f.windowSec),v:f.windowSec},{t:mm(f.leftSec),v:f.leftSec},{t:f.answeredAfter,v:f.answeredAfter},{t:f.scoreFirst,v:f.scoreFirst},{t:f.scoreAfter,v:f.scoreAfter}]}});delete TB.f;
 return h+W('f',tbl('f',[{h:'Name'},{h:'Score',n:1},{h:'Easy chosen / in paper'},{h:'Easy right',n:1},{h:'Medium chosen → right'},{h:'Difficult chosen → right'},{h:'Stuck Qs',n:1},{h:'Slow easy',n:1},{h:'Unmarked Qs over 1.5 min'},{h:'Window'},{h:'Time left'},{h:'Answered after',n:1},{h:'Score first',n:1},{h:'Score after',n:1}],rows,1,true))}
function qsV(){var lv=CUR.ql||'',q=CUR.test.questions.filter(function(x){return!lv||x.level===lv});delete TB.q;var LN={E:'Easy',M:'Medium',D:'Difficult'};
 return'<div class="tools"><select onchange="CUR.ql=this.value;drawTest()"><option value="">All levels</option><option value="E"'+(lv==='E'?' selected':'')+'>Easy</option><option value="M"'+(lv==='M'?' selected':'')+'>Medium</option><option value="D"'+(lv==='D'?' selected':'')+'>Difficult</option></select></div>'+W('q',tbl('q',[{h:'Q',n:1},{h:'Subject'},{h:'Chapter'},{h:'Level'},{h:'Type'},{h:'Key'},{h:'Attempted %',n:1},{h:'Correct % (of attempted)',n:1},{h:'Avg time',n:1},{h:'Expected',n:1},{h:'Over time %',n:1},{h:'Most common wrong'}],q.map(function(x){return{c:[{t:x.q+(x.dropped?' (dropped)':''),v:x.q},{t:x.subject,v:x.subject},{t:x.chapter,v:x.chapter},{t:LN[x.level]||x.level,v:x.level},{t:x.type,v:x.type},{t:x.key,v:x.key},{t:P(x.attemptedPct),v:x.attemptedPct},{t:P(x.correctOfAttempted),v:x.correctOfAttempted,k:col(x.correctOfAttempted)},{t:mm(x.avgTime),v:x.avgTime},{t:mm(x.exp),v:x.exp},{t:P(x.overPct),v:x.overPct},{t:x.topWrong,v:x.topWrong}]}}),0))}
function tcV(){var r=CUR.test,h='<h3>Sections (average score)</h3>'+r.bySection.map(function(s){return bar(s.name,s.avgPct,null,N(s.avg)+' / '+N(s.max))}).join('');
 h+='<h3>Easy, medium, difficult (average attempted − correct − in paper)</h3><p>Easy <b>'+r.abc.easy.join(' − ')+'</b> · Medium <b>'+r.abc.medium.join(' − ')+'</b> · Difficult <b>'+r.abc.difficult.join(' − ')+'</b></p>';
 h+='<h3>By question type (weakest first)</h3>'+r.byType.map(function(x){return bar(x.name+' ('+x.q+' Qs)',x.accuracy,null,P(x.accuracy)+' · '+x.correct+'/'+x.attempted)}).join('');
 if(r.byChapter.length>1)h+='<h3>By chapter (weakest first)</h3>'+r.byChapter.map(function(x){return bar(x.name+' ('+x.q+' Qs)',x.accuracy,null,P(x.accuracy)+' · '+x.correct+'/'+x.attempted)}).join('');return h}
/* ---------- one student ---------- */
function openStudent(sid){busy();call('t_student',{sid:sid}).then(function(r){if(!r.ok)return fail(r);CUR.stu=r;drawStudent()})}
function drawStudent(){var r=CUR.stu,s=r.student,A=r.attempts,f1=A.filter(function(a){return a.attemptNo===1}),h='<a class="back" onclick="'+(CUR.test?'drawTest()':'drawHome()')+'">&larr; Back</a><h2>'+esc(s.name)+'</h2><div class="sub">'+esc(s.sid)+' · '+esc(s.batch)+' · <button onclick="doReset(\''+esc(s.sid)+'\',\''+esc(s.name).replace(/\'/g,'')+'\')">Reset password</button></div>';
 var avg=f1.length?Math.round(10*f1.reduce(function(x,a){return x+(a.pct||0)},0)/f1.length)/10:null;
 h+='<div class="cards"><div class="card"><b>'+f1.length+'</b><span>tests taken</span></div><div class="card"><b>'+A.length+'</b><span>attempts</span></div><div class="card"><b>'+P(avg)+'</b><span>average (first attempts)</span></div><div class="card"><b>'+P(f1.length?f1[f1.length-1].pct:null)+'</b><span>latest test</span></div></div><div class="tools"><button onclick="window.print()">Print this profile</button></div>';
